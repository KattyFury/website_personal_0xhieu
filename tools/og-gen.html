<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  /* Nguồn render og.png (1200×630) — design system nguyen0xhieu, biến thể 0xhieu.xyz:
     nền trắng · chữ đen #000 / grey #4B5568 · vàng mắt mèo #FFA111 · Inter (font thiết kế) · khoảng cách bội số 8.
     Châm ngôn + câu niềm tin bản ngắn: NGUYÊN VĂN theo CLAUDE.md. */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Inter', sans-serif; color: #000; }
  .bar { position: absolute; left: 0; top: 0; width: 16px; height: 630px; background: #FFA111; }
  .wrap { padding: 96px 96px 0 112px; }
  .top { display: flex; align-items: center; gap: 40px; }
  .pfp { width: 160px; height: 160px; border-radius: 50%; object-fit: cover; outline: 8px solid #FFA111; outline-offset: 8px; }
  .name { font-size: 56px; line-height: 64px; font-weight: 700; letter-spacing: -0.022em; }
  .loc  { margin-top: 8px; font-size: 24px; line-height: 32px; color: #4B5568; letter-spacing: -0.019em; }
  .head { margin-top: 72px; font-size: 64px; line-height: 72px; font-weight: 700; letter-spacing: -0.022em; }
  .sub  { margin-top: 16px; font-size: 28px; line-height: 36px; color: #4B5568; letter-spacing: -0.021em; }
  .site { position: absolute; right: 96px; bottom: 56px; display: flex; align-items: center; gap: 16px;
          font-size: 32px; line-height: 40px; font-weight: 600; letter-spacing: -0.022em; }
  .site img { width: 48px; height: 48px; }
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="wrap">
    <div class="top">
      <img class="pfp" src="../pfp.png" alt="" />
      <div>
        <div class="name">Hieu Nguyen</div>
        <div class="loc">Hanoi, Vietnam</div>
      </div>
    </div>
    <div class="head">Sharing POVs on Crypto and AI</div>
    <div class="sub">AI is the future. Crypto is the money of the future.</div>
  </div>
  <div class="site"><img src="../icon.png" alt="" />0xhieu.xyz</div>
</body>
</html>
